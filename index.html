<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formato de Préstamo</title>
  <!-- Librerías externas -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.25/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f4f4f9; }
    header { background: #6a0dad; color: white; padding: 15px; text-align: center; display: flex; align-items: center; justify-content: center; }
    header img { height: 60px; margin-right: 15px; }
    h2 { margin: 5px 0; }
    main { padding: 20px; }
    label { font-weight: bold; margin-right: 10px; }
    select { padding: 5px; border-radius: 5px; border: 1px solid #ccc; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; background: white; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background-color: #6a0dad; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; font-weight: bold; }
    .btn-add { background-color: #28a745; color: white; }
    .btn-clear { background-color: #ffc107; color: black; }
    .btn-pdf { background-color: #6a0dad; color: white; }
    .btn-history { background-color: #17a2b8; color: white; }
    .delete-btn { background-color: crimson; color: white; border: none; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
    .delete-btn:hover { background-color: darkred; }
  </style>
</head>
<body>
  <header>
    <img src="INE_logo.png" alt="Logo INE">
    <div>
      <h3>JUNTA DISTRITAL EJECUTIVA 33</h3>
      <h3>VOCALÍA DE ORGANIZACIÓN ELECTORAL</h3>
      <h2>FORMATO DE PRÉSTAMOS DE MOBILIARIO Y MATERIAL ELÉCTRICO</h2>
    </div>
  </header>

  <main>
    <label>Área solicitante:</label>
    <select id="areaSolicitante">
      <option value="VE">VE</option>
      <option value="VS">VS</option>
      <option value="VCEyEC">VCEyEC</option>
      <option value="VRFE">VRFE</option>
    </select>

    <table id="materialTable">
      <thead>
        <tr>
          <th>Cantidad</th>
          <th>Descripción</th>
          <th>Estado</th>
          <th>Fecha préstamo</th>
          <th>Fecha devolución</th>
          <th>Solicita</th>
          <th>Autoriza</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="number"></td>
          <td><input type="text"></td>
          <td>
            <label><input type="radio" name="estado0" value="Bueno"> Bueno</label>
            <label><input type="radio" name="estado0" value="Regular"> Regular</label>
            <label><input type="radio" name="estado0" value="Malo"> Malo</label>
          </td>
          <td><input type="date"></td>
          <td><input type="date"></td>
          <td><input type="text"></td>
          <td><input type="text"></td>
          <td><button class="delete-btn" onclick="deleteRow(this)">🗑️</button></td>
        </tr>
      </tbody>
    </table>

    <button class="btn btn-add" onclick="addRow()">➕ Agregar material</button>
    <button class="btn btn-clear" onclick="clearTable()">🧹 Limpiar todo</button>
    <button class="btn btn-add" onclick="guardarEnBD()">💾 Guardar en BD</button>
    <button class="btn btn-history" onclick="verHistorial()">📜 Ver historial</button>
    <button class="btn btn-pdf" onclick="generatePDF()">📄 Generar PDF</button>

    <div id="historial"></div>
  </main>

  <!-- Script único -->
<script>
  const supabaseUrl = "https://tfcmjoqgypsdbjsdqkav.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRmY21qb3FneXBzZGJqc2Rxa2F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDM1MzIsImV4cCI6MjEwNTU3OTUzMn0.ftJI-X792hsx-BN0e9LM11W-AJjQE-0Egp6ivgJb3fI"; 
  
  // Solución 2: Usar desestructuración y renombrar la variable cliente a dbClient
  const { createClient } = window.supabase;
  const dbClient = createClient(supabaseUrl, supabaseKey);

  let rowCount = 1;

  function addRow() {
    const tbody = document.querySelector("#materialTable tbody");
    const row = document.createElement("tr");
    row.innerHTML = `
      <td><input type="number"></td>
      <td><input type="text"></td>
      <td>
        <label><input type="radio" name="estado${rowCount}" value="Bueno"> Bueno</label>
        <label><input type="radio" name="estado${rowCount}" value="Regular"> Regular</label>
        <label><input type="radio" name="estado${rowCount}" value="Malo"> Malo</label>
      </td>
      <td><input type="date"></td>
      <td><input type="date"></td>
      <td><input type="text"></td>
      <td><input type="text"></td>
      <td><button class="delete-btn" onclick="deleteRow(this)">🗑️</button></td>
    `;
    tbody.appendChild(row);
    rowCount++;
  }

  function deleteRow(button) {
    const row = button.closest("tr");
    row.remove();
  }

  function clearTable() {
    const tbody = document.querySelector("#materialTable tbody");
    tbody.innerHTML = "";
    rowCount = 0;
    addRow();
  }

 async function guardarEnBD() {
    const area = document.getElementById("areaSolicitante").value;
    const tableRows = document.querySelectorAll("#materialTable tbody tr");

    const registros = [];
    tableRows.forEach((tr, i) => {
      const cells = tr.querySelectorAll("td");
      let estado = "";
      const radios = cells[2].querySelectorAll("input[type=radio]");
      radios.forEach(r => { if (r.checked) estado = r.value; });

      const fechaPrestamo = cells[3].querySelector("input").value;
      const fechaDevolucion = cells[4].querySelector("input").value;
      const cantidadVal = cells[0].querySelector("input").value;

      registros.push({
        area: area,
        cantidad: cantidadVal !== "" ? parseInt(cantidadVal, 10) : 0,
        descripcion: cells[1].querySelector("input").value,
        estado: estado,
        fecha_prestamo: fechaPrestamo !== "" ? fechaPrestamo : null,
        fecha_devolucion: fechaDevolucion !== "" ? fechaDevolucion : null,
        solicita: cells[5].querySelector("input").value,
        autoriza: cells[6].querySelector("input").value,
        creado: new Date().toISOString() // <-- Esto llena automáticamente la columna timestamp
      });
    });

    const { data, error } = await dbClient.from("prestamos").insert(registros);

    if (error) {
      alert("❌ Error al guardar: " + error.message);
    } else {
      alert("✅ Datos guardados correctamente en Supabase");
    }
  }
  async function verHistorial() {
    const { data, error } = await dbClient.from("prestamos").select("*").order("id", { ascending: false });
    if (error) {
      alert("❌ Error al consultar historial: " + error.message);
      return;
    }

    let html = "<h3>Historial de préstamos</h3><table><thead><tr><th>ID</th><th>Área</th><th>Cantidad</th><th>Descripción</th><th>Estado</th><th>Fecha préstamo</th><th>Fecha devolución</th><th>Solicita</th><th>Autoriza</th><th>PDF</th></tr></thead><tbody>";
    data.forEach(reg => {
      html += `<tr>
        <td>${reg.id}</td>
        <td>${reg.area}</td>
        <td>${reg.cantidad}</td>
        <td>${reg.descripcion}</td>
        <td>${reg.estado}</td>
        <td>${reg.fecha_prestamo || ""}</td>
        <td>${reg.fecha_devolucion || ""}</td>
        <td>${reg.solicita}</td>
        <td>${reg.autoriza}</td>
        <td><button class="btn btn-pdf" onclick="generatePDFRegistro(${reg.id})">📄 PDF</button></td>
      </tr>`;
    });
    html += "</tbody></table>";
    document.getElementById("historial").innerHTML = html;
  }

  function generatePDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(12);
    doc.text("JUNTA DISTRITAL EJECUTIVA 33", 105, 20, { align: "center" });
    doc.text("VOCALÍA DE ORGANIZACIÓN ELECTORAL", 105, 30, { align: "center" });
    doc.setFontSize(14);
    doc.text("FORMATO DE PRÉSTAMOS DE MOBILIARIO Y MATERIAL ELÉCTRICO", 105, 45, { align: "center" });

    const area = document.getElementById("areaSolicitante").value;
    doc.setFontSize(12);
    doc.text("Área solicitante: " + area, 20, 65);

    const rows = [];
    const tableRows = document.querySelectorAll("#materialTable tbody tr");
    tableRows.forEach((tr, i) => {
      const cells = tr.querySelectorAll("td");
      let estado = "";
      const radios = cells[2].querySelectorAll("input[type=radio]");
      radios.forEach(r => { if (r.checked) estado = r.value; });
      rows.push([
        cells[0].querySelector("input").value,
        cells[1].querySelector("input").value,
        estado,
        cells[3].querySelector("input").value,
        cells[4].querySelector("input").value,
        cells[5].querySelector("input").value,
        cells[6].querySelector("input").value
      ]);
    });

    doc.autoTable({
      head: [["Cantidad","Descripción","Estado","Fecha préstamo","Fecha devolución","Solicita","Autoriza"]],
      body: rows,
      startY: 80,
      styles: { fontSize: 10, halign: "center" },
      headStyles: { fillColor: [106, 13, 173] }
    });

    const finalY = doc.lastAutoTable.finalY + 30;
    doc.setFontSize(12);
    doc.text("Firma del solicitante", 50, finalY);
    doc.text("Firma del que autoriza", 150, finalY);

    doc.line(40, finalY - 5, 90, finalY - 5);
    doc.line(140, finalY - 5, 190, finalY - 5);

    doc.save("Formato_Prestamo.pdf");
  }

  async function generatePDFRegistro(id) {
    const { data, error } = await dbClient.from("prestamos").select("*").eq("id", id).single();
    if (error) {
      alert("❌ Error al generar PDF: " + error.message);
      return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(12);
    doc.text("JUNTA DISTRITAL EJECUTIVA 33", 105, 20, { align: "center" });
    doc.text("VOCALÍA DE ORGANIZACIÓN ELECTORAL", 105, 30, { align: "center" });
    doc.setFontSize(14);
    doc.text("FORMATO DE PRÉSTAMOS DE MOBILIARIO Y MATERIAL ELÉCTRICO", 105, 45, { align: "center" });

    doc.setFontSize(12);
    doc.text("Área solicitante: " + data.area, 20, 65);

    doc.autoTable({
      head: [["Cantidad","Descripción","Estado","Fecha préstamo","Fecha devolución","Solicita","Autoriza"]],
      body: [[data.cantidad, data.descripcion, data.estado, data.fecha_prestamo || "", data.fecha_devolucion || "", data.solicita, data.autoriza]],
      startY: 80,
      styles: { fontSize: 10, halign: "center" },
      headStyles: { fillColor: [106, 13, 173] }
    });

    const finalY = doc.lastAutoTable.finalY + 30;
    doc.setFontSize(12);
    doc.text("Firma del solicitante", 50, finalY);
    doc.text("Firma del que autoriza", 150, finalY);

    doc.line(40, finalY - 5, 90, finalY - 5);
    doc.line(140, finalY - 5, 190, finalY - 5);

    doc.save("Prestamo_" + id + ".pdf");
  }
</script>
</body>
</html>
