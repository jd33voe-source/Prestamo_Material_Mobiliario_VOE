<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formato de Préstamo</title>
  <!-- Librerías externas -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.25/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f4f4f9; }
    header { background: #6a0dad; color: white; padding: 15px; text-align: center; display: flex; align-items: center; justify-content: center; }
    header img { height: 60px; margin-right: 15px; }
    h2 { margin: 5px 0; }
    main { padding: 20px; }
    label { font-weight: bold; margin-right: 10px; }
    select { padding: 5px; border-radius: 5px; border: 1px solid #ccc; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; background: white; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background-color: #6a0dad; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; font-weight: bold; }
    .btn-add { background-color: #28a745; color: white; }
    .btn-clear { background-color: #ffc107; color: black; }
    .btn-pdf { background-color: #6a0dad; color: white; }
    .btn-history { background-color: #17a2b8; color: white; }
    .delete-btn { background-color: crimson; color: white; border: none; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
    .delete-btn:hover { background-color: darkred; }
  </style>
</head>
<body>
  <header>
    <img src="INE_logo.png" alt="Logo INE">
    <div>
      <h3>JUNTA DISTRITAL EJECUTIVA 33</h3>
      <h3>VOCALÍA DE ORGANIZACIÓN ELECTORAL</h3>
      <h2>FORMATO DE PRÉSTAMOS DE MOBILIARIO Y MATERIAL ELÉCTRICO</h2>
    </div>
  </header>

  <main>
    <label>Área solicitante:</label>
    <select id="areaSolicitante">
      <option value="VE">VE</option>
      <option value="VS">VS</option>
      <option value="VCEyEC">VCEyEC</option>
      <option value="VRFE">VRFE</option>
    </select>

    <table id="materialTable">
      <thead>
        <tr>
          <th>Cantidad</th>
          <th>Descripción</th>
          <th>Estado</th>
          <th>Fecha préstamo</th>
          <th>Fecha devolución</th>
          <th>Solicita</th>
          <th>Autoriza</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="number"></td>
          <td><input type="text"></td>
          <td>
            <label><input type="radio" name="estado0" value="Bueno"> Bueno</label>
            <label><input type="radio" name="estado0" value="Regular"> Regular</label>
            <label><input type="radio" name="estado0" value="Malo"> Malo</label>
          </td>
          <td><input type="date"></td>
          <td><input type="date"></td>
          <td><input type="text"></td>
          <td><input type="text"></td>
          <td><button class="delete-btn" onclick="deleteRow(this)">🗑️</button></td>
        </tr>
      </tbody>
 </table>

    <button class="btn btn-add" onclick="addRow()">➕ Agregar material</button>
    <button class="btn btn-clear" onclick="clearTable()">🧹 Limpiar todo</button>
    <button class="btn btn-add" onclick="guardarEnBD()">💾 Guardar en BD</button>
    <!-- Cambiamos el onclick y agregamos el ID -->
    <button id="btnHistorial" class="btn btn-history" onclick="toggleHistorial()">📜 Ver historial</button>
    <button class="btn btn-pdf" onclick="generatePDF()">📄 Generar PDF</button>

<!-- Contenedor del historial -->
        <div id="historial" style="display: none; margin-top: 20px;"></div>
      </main>

      <!-- 👉 MODAL FLOTANTE -->
      <div id="modalEditar" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
          <h3>✏️ Editar Préstamo #<span id="editIdLabel"></span></h3>
          <input type="hidden" id="editIdRegistro">

          <div style="margin-bottom: 15px; margin-top: 15px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Fecha de Devolución:</label>
            <input type="date" id="editFechaDevolucion" style="width: 100%; padding: 8px; box-sizing: border-box;">
          </div>

          <div style="text-align: right; display: flex; justify-content: flex-end; gap: 10px;">
            <button class="btn" style="background-color: #666;" onclick="cerrarModalEditar()">Cancelar</button>
            <button class="btn" style="background-color: #10b981;" onclick="guardarCambiosEdicion()">💾 Actualizar</button>
          </div>
        </div>
      </div>
  <!-- Script único -->
<script>
  const supabaseUrl = "https://tfcmjoqgypsdbjsdqkav.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRmY21qb3FneXBzZGJqc2Rxa2F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDM1MzIsImV4cCI6MjEwNTU3OTUzMn0.ftJI-X792hsx-BN0e9LM11W-AJjQE-0Egp6ivgJb3fI";  
  
  const { createClient } = window.supabase;
  const dbClient = createClient(supabaseUrl, supabaseKey);

  let rowCount = 1;

  function addRow() {
    const tbody = document.querySelector("#materialTable tbody");
    const row = document.createElement("tr");
    row.innerHTML = `
      <td><input type="number"></td>
      <td><input type="text"></td>
      <td>
        <label><input type="radio" name="estado${rowCount}" value="Bueno"> Bueno</label>
        <label><input type="radio" name="estado${rowCount}" value="Regular"> Regular</label>
        <label><input type="radio" name="estado${rowCount}" value="Malo"> Malo</label>
      </td>
      <td><input type="date"></td>
      <td><input type="date"></td>
      <td><input type="text"></td>
      <td><input type="text"></td>
      <td><button class="delete-btn" onclick="deleteRow(this)">🗑️</button></td>
    `;
    tbody.appendChild(row);
    rowCount++;
  }

  function deleteRow(button) {
    const row = button.closest("tr");
    row.remove();
  }

  function clearTable() {
    const tbody = document.querySelector("#materialTable tbody");
    tbody.innerHTML = "";
    rowCount = 0;
    addRow();
  }

  // FUNCIÓN UNIFICADA Y CORREGIDA PARA GUARDAR EN solicitudes_prestamo
async function guardarEnBD() {
    const area = document.getElementById("areaSolicitante").value.trim();
    const tableRows = document.querySelectorAll("#materialTable tbody tr");

    // 1. Validar que el área solicitante no esté vacía
    if (!area) {
      alert("❌ El campo 'Área solicitante' es obligatorio.");
      return;
    }

    // 2. Validar que la tabla tenga al menos un renglón
    if (tableRows.length === 0) {
      alert("❌ Debe agregar al menos un artículo a la solicitud.");
      return;
    }

    const listaArticulos = [];
    let fechaPrestamoGlobal = null;
    let fechaDevolucionGlobal = null;
    let solicitaGlobal = "";
    let autorizaGlobal = "";
    let datosCompletos = true;
    let mensajeError = "";

    tableRows.forEach((tr, index) => {
      const cells = tr.querySelectorAll("td");
      let estado = "";
      const radios = cells[2].querySelectorAll("input[type=radio]");
      radios.forEach(r => { if (r.checked) estado = r.value; });

      const cantidadVal = cells[0].querySelector("input").value.trim();
      const descripcionVal = cells[1].querySelector("input").value.trim();

      // Validar que cada artículo tenga cantidad y descripción
      if (!cantidadVal || !descripcionVal) {
        datosCompletos = false;
        mensajeError = "Todos los artículos deben tener cantidad y descripción.";
      }

      listaArticulos.push({
        cantidad: cantidadVal !== "" ? parseInt(cantidadVal, 10) : 0,
        descripcion: descripcionVal,
        estado: estado
      });

      // Tomamos los datos generales de la solicitud (del primer renglón)
      if (index === 0) {
        fechaPrestamoGlobal = cells[3].querySelector("input").value.trim();
        fechaDevolucionGlobal = cells[4].querySelector("input").value.trim();
        solicitaGlobal = cells[5].querySelector("input").value.trim();
        autorizaGlobal = cells[6].querySelector("input").value.trim();
      }
    });

    // 3. Validar campos obligatorios globales (Fecha de préstamo, Solicita y Autoriza)
    if (!fechaPrestamoGlobal || !solicitaGlobal || !autorizaGlobal) {
      datosCompletos = false;
      mensajeError = "Los campos de 'Fecha de préstamo', 'Solicita' y 'Autoriza' en el primer renglón son obligatorios.";
    }

    // Si falta algún dato obligatorio, detenemos el proceso y alertamos al usuario
    if (!datosCompletos) {
      alert("❌ Faltan datos obligatorios: " + mensajeError);
      return;
    }

    const nuevaSolicitud = {
      area: area,
      fecha_prestamo: fechaPrestamoGlobal,
      fecha_devolucion: fechaDevolucionGlobal !== "" ? fechaDevolucionGlobal : null,
      solicita: solicitaGlobal,
      autoriza: autorizaGlobal,
      articulos: listaArticulos,
      creado: new Date().toISOString()
    };

    console.log("Enviando solicitud a Supabase:", nuevaSolicitud);

    const { data, error } = await dbClient.from("solicitudes_prestamo").insert([nuevaSolicitud]);

    if (error) {
      console.error("Detalle del error de Supabase:", error);
      alert("❌ Error al guardar la solicitud en la BD: " + error.message);
    } else {
      alert("✅ ¡Solicitud guardada correctamente!");
      clearTable();
    }
  }

  let historialVisible = false; // Estado inicial

  async function toggleHistorial() {
    const contenedor = document.getElementById("historial");
    const boton = document.getElementById("btnHistorial");

    if (!historialVisible) {
      // Si está oculto, consultamos los datos a Supabase
      const { data, error } = await dbClient.from("solicitudes_prestamo").select("*").order("id", { ascending: false });
      
      if (error) {
        alert("❌ Error al consultar historial: " + error.message);
        return;
      }

      let html = "<h3>Historial de Solicitudes</h3><table><thead><tr><th>ID</th><th>Área</th><th>Fecha Préstamo</th><th>Solicita</th><th>Autoriza</th><th>Artículos</th><th>Acción</th></tr></thead><tbody>";
      
      data.forEach(reg => {
        let listaArticulosHtml = "<ul style='margin: 0; padding-left: 15px; text-align: left;'>";
        if (reg.articulos && Array.isArray(reg.articulos)) {
          reg.articulos.forEach(art => {
            listaArticulosHtml += `<li><b>${art.cantidad}</b> - ${art.descripcion} (<i>${art.estado}</i>)</li>`;
          });
        }
        listaArticulosHtml += "</ul>";

       html += `<tr>
          <td><b>#${reg.id}</b></td>
          <td>${reg.area}</td>
          <td>${reg.fecha_prestamo || "N/A"}</td>
          <td>${reg.solicita}</td>
          <td>${reg.autoriza}</td>
          <td>${listaArticulosHtml}</td>
          <td>
            <button class="btn btn-pdf" onclick="generatePDFRegistro(${reg.id})">📄 PDF</button><br>
            <button class="btn" style="background-color: #d97706; margin-top: 5px;" onclick="abrirModalEditar(${reg.id})">✏️ Editar</button>
          </td>
        </tr>`;
      });
      
      html += "</tbody></table>";
      contenedor.innerHTML = html;
      
      // Mostramos el contenedor y actualizamos el botón
      contenedor.style.display = "block";
      boton.textContent = "📂 Ocultar historial";
      boton.style.backgroundColor = "#555"; 
      historialVisible = true;
    } else {
      // Si ya está visible, lo ocultamos
      contenedor.style.display = "none";
      boton.textContent = "📜 Ver historial";
      boton.style.backgroundColor = ""; 
      historialVisible = false;
    }
  }
 // Ejemplo aplicado para generatePDF (puedes replicarlo igual en generatePDFRegistro)
  async function generatePDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    // 1. Agregar Logotipo en la esquina superior izquierda
    // Parámetros: (imagen, formato, x, y, ancho, alto)
    // Nota: Puedes usar una URL directa de tu repositorio (ej. "./logo_ine.png") o una cadena en Base64
    try {
      const logoUrl = "./INE_logo.png";
      doc.addImage(logoUrl, "PNG", 15, 12, 25, 25); 
    } catch (e) {
      console.warn("No se pudo cargar el logotipo automáticamente:", e);
    }

    // 2. Encabezados institucionales (ajustados para no encimarse con el logo)
    doc.setFontSize(11);
    doc.text("JUNTA DISTRITAL EJECUTIVA 33", 110, 18, { align: "center" });
    doc.text("VOCALÍA DE ORGANIZACIÓN ELECTORAL", 110, 25, { align: "center" });
    
    doc.setFontSize(13);
    doc.text("FORMATO DE PRÉSTAMOS DE MOBILIARIO Y MATERIAL ELÉCTRICO", 110, 38, { align: "center" });

    const area = document.getElementById("areaSolicitante").value;
    doc.setFontSize(12);
    doc.text("Área solicitante: " + area, 20, 55);

    // 3. Recorrido de la tabla para el PDF
    const rows = [];
    const tableRows = document.querySelectorAll("#materialTable tbody tr");
    tableRows.forEach((tr, i) => {
      const cells = tr.querySelectorAll("td");
      let estado = "";
      const radios = cells[2].querySelectorAll("input[type=radio]");
      radios.forEach(r => { if (r.checked) estado = r.value; });
      rows.push([
        cells[0].querySelector("input").value,
        cells[1].querySelector("input").value,
        estado,
        cells[3].querySelector("input").value,
        cells[4].querySelector("input").value,
        cells[5].querySelector("input").value,
        cells[6].querySelector("input").value
      ]);
    });

    doc.autoTable({
      head: [["Cantidad","Descripción","Estado","Fecha préstamo","Fecha devolución","Solicita","Autoriza"]],
      body: rows,
      startY: 65, // Ajustado para dar espacio al nuevo encabezado
      styles: { fontSize: 10, halign: "center" },
      headStyles: { fillColor: [106, 13, 173] }
    });

    const finalY = doc.lastAutoTable.finalY + 25;
    doc.setFontSize(12);
    doc.text("Firma del solicitante", 50, finalY);
    doc.text("Firma del que autoriza", 150, finalY);

    doc.line(40, finalY - 5, 90, finalY - 5);
    doc.line(140, finalY - 5, 190, finalY - 5);

    doc.save("Formato_Prestamo.pdf");
  }
  async function generatePDFRegistro(id) {
    const { data, error } = await dbClient.from("solicitudes_prestamo").select("*").eq("id", id).single();
    if (error) {
      alert("❌ Error al generar PDF: " + error.message);
      return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(12);
    doc.text("JUNTA DISTRITAL EJECUTIVA 33", 105, 20, { align: "center" });
    doc.text("VOCALÍA DE ORGANIZACIÓN ELECTORAL", 105, 30, { align: "center" });
    doc.setFontSize(14);
    doc.text("FORMATO DE PRÉSTAMOS DE MOBILIARIO Y MATERIAL ELÉCTRICO", 105, 45, { align: "center" });

    doc.setFontSize(12);
    doc.text("Área solicitante: " + data.area, 20, 65);
    doc.text("Folio de Solicitud: #" + data.id, 20, 72);

    const rows = [];
    if (data.articulos && Array.isArray(data.articulos)) {
      data.articulos.forEach(art => {
        rows.push([
          art.cantidad,
          art.descripcion,
          art.estado,
          data.fecha_prestamo || "",
          data.fecha_devolucion || "",
          data.solicita,
          data.autoriza
        ]);
      });
    }

    doc.autoTable({
      head: [["Cantidad","Descripción","Estado","Fecha préstamo","Fecha devolución","Solicita","Autoriza"]],
      body: rows,
      startY: 80,
      styles: { fontSize: 10, halign: "center" },
      headStyles: { fillColor: [106, 13, 173] }
    });

    const finalY = doc.lastAutoTable.finalY + 30;
    doc.setFontSize(12);
    doc.text("Firma del solicitante", 50, finalY);
    doc.text("Firma del que autoriza", 150, finalY);

    doc.line(40, finalY - 5, 90, finalY - 5);
    doc.line(140, finalY - 5, 190, finalY - 5);

    doc.save("Solicitud_Prestamo_" + id + ".pdf");
  }
  // Abrir el modal y cargar los datos actuales del registro
  async function abrirModalEditar(id) {
    const { data, error } = await dbClient.from("solicitudes_prestamo").select("*").eq("id", id).single();
    
    if (error) {
      alert("❌ No se pudo cargar el registro: " + error.message);
      return;
    }

    // Asignamos los valores a los inputs del modal
    document.getElementById("editIdRegistro").value = data.id;
    document.getElementById("editIdLabel").textContent = data.id;
    document.getElementById("editFechaDevolucion").value = data.fecha_devolucion || "";

    // Mostramos el modal
    document.getElementById("modalEditar").style.display = "flex";
  }

  // Cerrar el modal
  function cerrarModalEditar() {
    document.getElementById("modalEditar").style.display = "none";
  }

  // Guardar la nueva fecha de devolución en Supabase
  async function guardarCambiosEdicion() {
    const id = document.getElementById("editIdRegistro").value;
    const nuevaFechaDevolucion = document.getElementById("editFechaDevolucion").value;

    const { error } = await dbClient
      .from("solicitudes_prestamo")
      .update({ 
        fecha_devolucion: nuevaFechaDevolucion !== "" ? nuevaFechaDevolucion : null 
      })
      .eq("id", id);

    if (error) {
      alert("❌ Error al actualizar: " + error.message);
      return;
    }

    alert("✅ ¡Fecha de devolución actualizada correctamente!");
    cerrarModalEditar();
    
    // Recargamos el historial automáticamente para reflejar el cambio
    historialVisible = false; 
    toggleHistorial();        
  }
</script>
</body>
</html>
